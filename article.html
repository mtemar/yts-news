<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article | YTS News</title><link rel="stylesheet" href="style.css"></head><body><header><div class="top"><span>VANUATU • DIGITAL NEWSROOM</span></div><div class="mast"><a class="logo" href="./">YTS<span>NEWS</span><small>YUMI TOKTOK STRET</small></a><nav><a href="./">Home</a></nav></div></header><main><article class="article"><a class="back" href="./">← Back to all stories</a><div id="article"><h1>Loading article…</h1></div></article></main><footer><strong>YTS<span>NEWS</span></strong><p>Yumi Toktok Stret · Port Vila, Vanuatu</p></footer><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');fetch('articles.json').then(r=>r.json()).then(items=>{const a=items.find(x=>x.id===id);if(!a){document.querySelector('#article').innerHTML='<h1>Article not found</h1>';return}document.title=a.title+' | YTS News';document.querySelector('#article').innerHTML='<p class="eyebrow">'+esc(a.category)+'</p><h1>'+esc(a.title)+'</h1><p class="meta">'+esc(a.date)+' · '+esc(a.author)+'</p><div class="body">'+(a.body||[]).map(p=>'<p>'+esc(p)+'</p>').join('')+'</div>'}).catch(()=>document.querySelector('#article').textContent='Unable to load article.');</script></body></html>
